name: Build Desktop App

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  VITE_SIGNALING_URL: ${{ vars.VITE_SIGNALING_URL || 'http://124.220.4.69:9000' }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install client deps
        run: npm install --prefix client

      - name: Build client
        run: npm run build --prefix client
        env:
          VITE_SIGNALING_URL: ${{ env.VITE_SIGNALING_URL }}

      - name: Install desktop deps
        run: npm install --prefix desktop

      - name: Build Windows EXE
        run: npm run build:win --prefix desktop

      - name: List dist output
        run: dir desktop\dist

      - uses: actions/upload-artifact@v4
        with:
          name: holographic-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.exe.blockmap
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux packager deps
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm libfuse2

      - name: Install client deps
        run: npm install --prefix client

      - name: Build client
        run: npm run build --prefix client
        env:
          VITE_SIGNALING_URL: ${{ env.VITE_SIGNALING_URL }}

      - name: Install desktop deps
        run: npm install --prefix desktop

      - name: Build Linux AppImage & deb
        run: npm run build:linux --prefix desktop

      - name: List dist output
        run: ls -lah desktop/dist/

      - uses: actions/upload-artifact@v4
        with:
          name: holographic-linux
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error

  build-server-docker:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build signaling image
        run: docker build -t holographic-signaling ./server

  build-android:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: holographic-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build-windows.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: holographic-windows
          path: release/windows

      - uses: actions/download-artifact@v4
        if: needs.build-linux.result == 'success'
        with:
          name: holographic-linux
          path: release/linux

      - name: Prepare release assets
        run: |
          mkdir -p release-bundle
          cp release/windows/* release-bundle/
          if [ -d release/linux ]; then cp release/linux/* release-bundle/; fi
          ls -lah release-bundle/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-bundle/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
