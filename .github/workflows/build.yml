name: Build Desktop App

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  VITE_SIGNALING_URL: ${{ vars.VITE_SIGNALING_URL || 'http://124.220.4.69:9000' }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install client deps
        run: npm install --prefix client

      - name: Build client
        run: npm run build --prefix client
        env:
          VITE_SIGNALING_URL: ${{ env.VITE_SIGNALING_URL }}

      - name: Set desktop semver from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SEMVER=$(echo "$TAG" | sed -E 's/^([0-9]+)\.([0-9]+)\.([0-9]+)\.([0-9]+)$/\1.\2.\3-\4/')
          node -e "const fs=require('fs'); const p=require('./desktop/package.json'); p.version='$SEMVER'; fs.writeFileSync('desktop/package.json', JSON.stringify(p,null,2)+'\n'); console.log('desktop version:', p.version);"

      - name: Install desktop deps
        run: npm install --prefix desktop

      - name: Generate desktop icons
        run: python scripts/generate-desktop-icons.py

      - name: Build Windows EXE
        run: npm run build:win --prefix desktop
        env:
          VITE_SIGNALING_URL: ${{ env.VITE_SIGNALING_URL }}

      - name: List dist output
        run: dir desktop\dist

      - uses: actions/upload-artifact@v4
        with:
          name: holographic-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.exe.blockmap
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux packager deps
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm libfuse2

      - name: Install client deps
        run: npm install --prefix client

      - name: Build client
        run: npm run build --prefix client
        env:
          VITE_SIGNALING_URL: ${{ env.VITE_SIGNALING_URL }}

      - name: Set desktop semver from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SEMVER=$(echo "$TAG" | sed -E 's/^([0-9]+)\.([0-9]+)\.([0-9]+)\.([0-9]+)$/\1.\2.\3-\4/')
          node -e "const fs=require('fs'); const p=require('./desktop/package.json'); p.version='$SEMVER'; fs.writeFileSync('desktop/package.json', JSON.stringify(p,null,2)+'\n'); console.log('desktop version:', p.version);"

      - name: Install desktop deps
        run: npm install --prefix desktop

      - name: Generate desktop icons
        run: python3 scripts/generate-desktop-icons.py

      - name: Build Linux AppImage
        run: npm run build:linux --prefix desktop
        env:
          VITE_SIGNALING_URL: ${{ env.VITE_SIGNALING_URL }}

      - name: List dist output
        run: ls -lah desktop/dist/

      - uses: actions/upload-artifact@v4
        with:
          name: holographic-linux
          path: desktop/dist/*.AppImage
          if-no-files-found: error

  build-server-docker:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build signaling image
        run: docker build -t holographic-signaling ./server

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "platforms;android-34" "build-tools;35.0.0" "build-tools;34.0.0"
      - name: Ensure MediaPipe model
        run: |
          if [ -f android/app/src/main/assets/selfie_segmenter.tflite ]; then
            echo "Model already in repo, skip download"
          else
            bash android/scripts/download-model.sh
          fi
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Use official Gradle distribution (CI)
        run: |
          sed -i 's|https\\://mirrors.cloud.tencent.com/gradle/gradle-|https\\://services.gradle.org/distributions/gradle-|' android/gradle/wrapper/gradle-wrapper.properties
      - name: Build debug APK
        working-directory: android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            echo "Gradle attempt $attempt"
            if ./gradlew assembleDebug --no-daemon -x lint --stacktrace; then
              exit 0
            fi
            sleep 15
          done
          exit 1
      - name: Verify APK output
        run: |
          ls -lah android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: holographic-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    needs: [build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build-windows.result == 'success' &&
      needs.build-android.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: holographic-windows
          path: release/windows

      - uses: actions/download-artifact@v4
        if: needs.build-linux.result == 'success'
        with:
          name: holographic-linux
          path: release/linux

      - uses: actions/download-artifact@v4
        with:
          name: holographic-android
          path: release/android

      - name: Prepare release assets
        run: |
          mkdir -p release-bundle
          cp release/windows/* release-bundle/
          if [ -d release/linux ] && [ "$(ls -A release/linux 2>/dev/null)" ]; then
            cp release/linux/* release-bundle/
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          APK="$(find release/android -name '*.apk' | head -1)"
          if [ -n "$APK" ]; then
            cp "$APK" "release-bundle/holographic-${VERSION}.apk"
          else
            echo "Error: Android APK artifact not found"
            ls -R release/android || true
            exit 1
          fi
          ls -lah release-bundle/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-bundle/*.exe
            release-bundle/*.exe.blockmap
            release-bundle/*.apk
            release-bundle/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload EXE to signaling server
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          EXE=$(find release-bundle -maxdepth 1 -name 'HolographicSystem-Portable*.exe' | head -1)
          if [ -z "$EXE" ]; then
            echo "No portable EXE found in release-bundle"
            ls -lah release-bundle/
            exit 1
          fi
          echo "Uploading $EXE (${VERSION}) to signaling server..."
          TOKEN="${{ secrets.PUBLISH_SECRET }}"
          URL="http://124.220.4.69:9000/api/admin/publish-exe?version=${VERSION}&notes=v${VERSION}%20CI%20release"
          if [ -n "$TOKEN" ]; then URL="${URL}&token=${TOKEN}"; fi
          curl -f --connect-timeout 30 -m 900 \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$EXE" \
            "$URL"
          echo "EXE uploaded to signaling server"

      - name: Upload APK to signaling server
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION_CODE=$(grep 'versionCode' android/app/build.gradle.kts | grep -oE '[0-9]+' | head -1)
          APK=$(find release-bundle -maxdepth 1 -name 'holographic-*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "No APK found in release-bundle"
            ls -lah release-bundle/
            exit 1
          fi
          echo "Uploading $APK (${VERSION}, code ${VERSION_CODE}) to signaling server..."
          TOKEN="${{ secrets.PUBLISH_SECRET }}"
          URL="http://124.220.4.69:9000/api/admin/publish-apk?version=${VERSION}&versionCode=${VERSION_CODE}&notes=v${VERSION}%20CI%20release"
          if [ -n "$TOKEN" ]; then URL="${URL}&token=${TOKEN}"; fi
          curl -f --connect-timeout 30 -m 900 \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$APK" \
            "$URL" || echo "APK upload to signaling server skipped (API may need deploy)"
