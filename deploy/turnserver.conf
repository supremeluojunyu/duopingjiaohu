# coturn TURN 服务器
# 使用 lt-cred-mech + 静态用户（与 server TURN_USER/TURN_PASS 一致）

listening-port=3478
fingerprint
lt-cred-mech
realm=holographic.local
total-quota=100
stale-nonce=600
no-multicast-peers
no-cli

# 静态用户（生产环境请修改密码）
user=holo:holo123456

listening-ip=0.0.0.0
relay-ip=0.0.0.0

# 公网部署：取消注释并设置 external-ip
# external-ip=YOUR_PUBLIC_IP

# 端口范围（防火墙需放行 UDP）
min-port=49152
max-port=65535

verbose
